name: Release automatica

# A ogni push su main legge la versione dal manifest.json e, se la release
# vX.Y.Z non esiste ancora, crea tag e release su GitHub. Così il Marketplace
# di Home Assistant mostra la versione 1.0.x invece del codice del commit.
on:
  push:
    branches: [main]
    paths:
      - "custom_components/desco/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leggi la versione
        id: v
        run: echo "version=$(jq -r .version custom_components/desco/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Crea tag e release se mancano
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            TAG_SHA=$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)
            if [ "$TAG_SHA" = "$GITHUB_SHA" ]; then
              echo "La release v$VERSION esiste già"
              exit 0
            fi
            # stesso numero di versione ma codice nuovo (es. una versione ritirata e rifatta): la release si sostituisce
            echo "Sostituisco la release v$VERSION (era su $TAG_SHA)"
            gh release delete "v$VERSION" --yes --cleanup-tag
          fi
          NOTE=$(git log -1 --pretty=%B | sed '/^Co-Authored-By:/d;/^Claude-Session:/d')
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Desco $VERSION" --notes "$NOTE"
